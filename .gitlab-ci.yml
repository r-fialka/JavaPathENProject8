image: maven:3.9-eclipse-temurin-21

stages:
  - build
  - test
  - package

compile_job:
  stage: build
  script:
    - mvn compile

test_job:
  stage: test
  script:
    - mvn test -Dtest='!PerformanceTest'

package_job:
  stage: package
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week