image: maven:3.9-eclipse-temurin-21

stages:
  - build
  - test
  - package

before_script:
  - export PROJECT_DIR=$(dirname $(find . -name "pom.xml" | head -n 1))
  - cd $PROJECT_DIR
  - echo "Building in directory: $(pwd)"

compile_job:
  stage: build
  script:
    - mvn compile

test_job:
  stage: test
  script:
    - mvn test -Dtest='!PerformanceTest'

package_job:
  stage: package
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - $PROJECT_DIR/target/*.jar
    expire_in: 1 week